name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and smoke-test the production server
        run: |
          npm run build
          PORT=4100 node dist/index.js &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:4100/health && exit 0; sleep 0.5; done
          exit 1
